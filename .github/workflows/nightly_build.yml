name: "GLPI nightly build"

permissions:
  contents: "read"

on:
  # Runs test suite every night
  schedule:
    - cron:  '0 0 * * *'
  # Enable manual run
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write  # for Git to git push
    if: github.repository == 'glpi-project/glpi'
    name: "Build ${{ matrix.branch }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # build on lower supported version to ensure building tools are compatible with this version
          - {branch: "10.0/bugfixes", version-name: "10.0", php-version: "7.4"}
          - {branch: "11.0/bugfixes", version-name: "11.0", php-version: "8.2"}
          - {branch: "main", version-name: "dev", php-version: "8.3"}
    services:
      app:
        image: "ghcr.io/glpi-project/githubactions-php:${{ matrix.php-version }}"
        options: >-
          --volume /glpi:/var/www/glpi
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          ref: ${{ matrix.branch }}
      - name: "Define variables"
        id: vars
        run: |
          SHA=$( git rev-parse HEAD )
          if [ -n "$( git rev-list -n 1 --after="24 hours" $SHA )" ]; then
            echo "build=yes" >> $GITHUB_OUTPUT
          else
            echo "build=no" >> $GITHUB_OUTPUT
            echo "::notice::No new commit on ${{ matrix.branch }} in the last 24h — build skipped."
          fi
          REF_NAME=$(echo ${{ matrix.version-name }})
          SHA=$(git rev-parse --short HEAD)
          echo "release_name=$REF_NAME-$SHA" >> $GITHUB_OUTPUT
      - name: "Deploy source into app container"
        if: ${{ steps.vars.outputs.build == 'yes' }}
        run: |
          sudo cp --no-target-directory --preserve --recursive `pwd` /glpi
          sudo chown -R 1000:1000 /glpi
      - name: "Install dependencies"
        if: ${{ steps.vars.outputs.build == 'yes' }}
        run: |
          docker exec ${{ job.services.app.id }} composer install --optimize-autoloader --prefer-dist --no-interaction --no-progress --no-suggest
      - name: "Build"
        if: ${{ steps.vars.outputs.build == 'yes' }}
        run: |
          docker exec --interactive ${{ job.services.app.id }} tools/make_release.sh -y . ${{ steps.vars.outputs.release_name }}
          docker cp ${{ job.services.app.id }}:/tmp/glpi-${{ steps.vars.outputs.release_name }}.tgz ${{ github.workspace }}/${{ steps.vars.outputs.release_name }}.tar.gz
          cp ${{ github.workspace }}/${{ steps.vars.outputs.release_name }}.tar.gz ${{ github.workspace }}/${{ matrix.version-name }}.tar.gz
      - name: "Publish nightly release"
        if: ${{ steps.vars.outputs.build == 'yes' }}
        id: publish-nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="nightly-${{ matrix.version-name }}"
          ASSET_NAME="${{ matrix.version-name }}.tar.gz"
          ASSET_PATH="${{ github.workspace }}/${ASSET_NAME}"
          COMMIT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +'%F %H:%M UTC')"
          NOTES="Rolling nightly build of the \`${{ matrix.branch }}\` branch (commit \`${COMMIT_SHA}\`, built ${BUILD_DATE}). This (pre)release is updated in place every night — the asset below always points to the latest build, not a fixed version."

          # Published once, then updated in place every night: unlike a git-committed file,
          # a release asset has no 100 MiB size limit and does not bloat repository history.
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --prerelease \
              --title "GLPI nightly build (${{ matrix.branch }})" \
              --notes "$NOTES"

          gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "${{ github.repository }}" --clobber
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes "$NOTES"

          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          echo "asset-url=$ASSET_URL" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/checkout@v7
        if: ${{ steps.vars.outputs.build == 'yes' }}
        with:
          repository: ${{ github.repository_owner }}/glpi-project.github.io
          token: ${{ secrets.GH_PUBLISHING_TOKEN }}
          path: nightly
      - name: "Update nightly index page"
        if: ${{ steps.vars.outputs.build == 'yes' }}
        run: |
          EMAIL="$(git log --format='%ae' HEAD^!)"
          NAME="$(git log --format='%an' HEAD^!)"
          chmod +x tools/github-nightly-description.sh
          cd nightly
          git config --local user.email "$EMAIL"
          git config --local user.name "$NAME"
          ../tools/github-nightly-description.sh \
            glpi/nightly-builds.tsv \
            glpi/index.md \
            "${{ matrix.version-name }}" \
            "${{ steps.publish-nightly.outputs.asset-url }}" \
            "$(stat -c %s ${{ github.workspace }}/${{ matrix.version-name }}.tar.gz)"
          git add glpi/index.md glpi/nightly-builds.tsv
          if git diff --cached --quiet; then
            echo "Index page already up to date, nothing to push."
          else
            git commit -m "Update nightly build index (${{ matrix.version-name }})"
            git push
          fi
        shell: bash
